[package]
name = "pos-db"
version = "0.1.0"
edition = "2021"
description = "Persistencia SQLite del punto de venta: migraciones y repositorios."

[dependencies]
pos-core = { path = "../pos-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tempfile = "3"
