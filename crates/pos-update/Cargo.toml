[package]
name = "pos-update"
version = "0.1.0"
edition = "2021"
description = "Actualizaciones firmadas (Ed25519) con respaldo y marcha atras."

[dependencies]
pos-core = { path = "../pos-core" }
# Verificación Ed25519: la única forma de aceptar un ejecutable nuevo.
# `pos` sólo verifica; firmar se hace con la herramienta `pos-firmar`, así que
# con LTO el código de firmado no llega al binario de la tienda.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Sólo para la herramienta de firmado: el binario de la tienda no genera llaves
# ni necesita un generador de aleatorios.
rand_core = { version = "0.6", features = ["getrandom"], optional = true }

[features]
firmar = ["rand_core"]

[[bin]]
name = "pos-firmar"
path = "src/bin/pos-firmar.rs"
